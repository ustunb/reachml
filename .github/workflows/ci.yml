# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
      tags:
        - "v*"    # e.g., v1.0.0
      branches: [ "main", "iclr2025"]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write      # required for pypi oidc

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-local-path: "~/.local"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked

      - name: Run tests
        # For example, using `pytest`
        run: uv run pytest tests

  build-and-publish:
    if: startsWith(github.ref, 'refs/tags/v')    # only on tags like v0.1.0
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-local-path: "~/.local"

      # Build sdist and wheel into ./dist
      # Use either uv build (preferred) or python -m build
      - name: Build distributions
        run: |
          uv run python -m pip install --upgrade build
          uv run python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          
