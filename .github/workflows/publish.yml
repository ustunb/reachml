name: "Build and Publish reachml to TestPyPI"

on:
  push:
    branches: [ "main" ]
    tags:
      # Publish on any tag starting with a `v`, e.g., v0.1.0
      - v*

jobs:
  run:
    runs-on: ubuntu-latest
    # environment:
    #   name: testpypi
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Build
        run: uv build

      - name: Set TestPyPI publish URL
        run: echo "PUBLISH_URL=https://test.pypi.org/legacy/" >> $GITHUB_ENV

      - name: Publish to TestPyPI
        if: matrix.python-version == '3.12'
        run: uv publish --publish-url "$PUBLISH_URL"